name: Daily YouTube Short

on:
  schedule:
    # 03:17 UTC = 08:47 Asia/Kolkata. GitHub may delay or skip scheduled runs.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and validate only; do not upload (recommended for testing)"
        type: boolean
        required: true
        default: true

permissions:
  contents: write

concurrency:
  group: daily-shorts-publisher
  cancel-in-progress: false

jobs:
  create-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CONTENT_NICHE: ${{ vars.CONTENT_NICHE || 'all' }}
      VIDEO_LANGUAGE: ${{ vars.VIDEO_LANGUAGE || 'en' }}
      TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
      UPLOAD_PRIVACY: ${{ vars.UPLOAD_PRIVACY || 'unlisted' }}
      DAILY_UPLOAD_ENABLED: ${{ vars.DAILY_UPLOAD_ENABLED || 'false' }}
      ALLOW_PUBLIC_UPLOADS: ${{ vars.ALLOW_PUBLIC_UPLOADS || 'false' }}
      DRY_RUN: 'false'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply manual dry-run selection
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "DRY_RUN=true" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Run unit tests
        run: python -m pytest

      - name: Validate configuration and curated source metadata
        run: python scripts/validate_environment.py

      - name: Generate, validate, and optionally upload
        run: python -m shorts_factory

      - name: Commit successful publication state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Shorts publication state [skip ci]"
            git push
          fi

      - name: Save short-retention debug artifact
        if: always() && (github.event_name == 'workflow_dispatch' || failure() || vars.DAILY_UPLOAD_ENABLED != 'true')
        uses: actions/upload-artifact@v4
        with:
          name: shorts-factory-debug-${{ github.run_id }}
          path: build/output/
          if-no-files-found: ignore
          retention-days: 2
