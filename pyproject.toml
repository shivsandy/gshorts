[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-factory"
version = "1.0.0"
description = "A zero-paid-API local video pipeline with guarded YouTube publishing via GitHub Actions."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "YouTube Shorts Factory contributors"}]
dependencies = [
  "Pillow==12.3.0",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]

[project.scripts]
shorts-factory = "shorts_factory.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
